name: Scheduled publish

# 公開予定表（.github/publish-schedule.json）の日付を迎えた記事を published: true にする。
# Zenn は push で公開され、Qiita は Publish articles ワークフローが公開する。
#
# 公開面で先行記事を確認してから、1回につき最大1本を切り替える。
# 投稿数の上限自体は予測できないため、事後の掲載確認も別workflowで行う。

on:
  schedule:
    # 03:00 UTC = 12:00 JST（毎日）
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  flip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "公開日を迎えた記事を published: true にする"
        id: flip
        run: |
          set -euo pipefail
          candidate=$(python3 scripts/publication_status.py next --date "$(TZ=Asia/Tokyo date +%F)")
          if [ -z "$candidate" ]; then
            echo "公開対象なし"
            exit 0
          fi
          export CANDIDATE="$candidate"
          python3 - <<'PY'
          import io, os, re

          slug = os.environ["CANDIDATE"]
          path = "articles/%s.md" % slug
          text = io.open(path, encoding="utf-8").read()
          updated, count = re.subn(r"^published: false$", "published: true", text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("公開フラグが予期した状態ではありません: " + slug)
          io.open(path, "w", encoding="utf-8").write(updated)
          print("公開に切り替え:", slug)

          with io.open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("flipped=%s\n" % slug)
          PY

      - name: コミットして push
        if: steps.flip.outputs.flipped != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/
          git commit -m "Publish scheduled articles: ${{ steps.flip.outputs.flipped }}"
          git push

      - name: Publish articles ワークフローを起動
        if: steps.flip.outputs.flipped != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN による push では他のワークフローが起動しないため、明示的に呼ぶ
          gh workflow run "Publish articles" --ref main
